# Builds the downloadable skill files (dist/*.zip, dist/*.md) with scripts/build-zip.sh.
# - pull_request: validate and build only; the files are attached to the run as an artifact.
# - push to main: also publish them as GitHub Release v<version> (semver from
#   .claude-plugin/plugin.json) marked latest, so
#   https://github.com/sepayvn/sepay-skills/releases/latest/download/sepay.zip
#   always serves the skill as it is on main (the same version `npx skills update` installs).
name: Build skill downloads

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/build-zip.sh"
      - ".claude-plugin/**"
      - ".github/workflows/release-zip.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/build-zip.sh"
      - ".claude-plugin/**"
      - ".github/workflows/release-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-zip.sh stamps files with the last commit time of skills/

      - name: Build
        run: bash scripts/build-zip.sh

      # Claude Code and the Claude directory ship a plugin update only when
      # .claude-plugin/plugin.json `version` changes, so a skill change must raise it.
      - name: Require a plugin version bump
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" HEAD -- skills; then
            echo "skills/ unchanged, no bump needed."; exit 0
          fi
          old="$(git show "$BASE:.claude-plugin/plugin.json" 2>/dev/null | jq -r '.version // empty' || true)"
          new="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [ -n "$old" ] && [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)" != "$new" -o "$old" = "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::skills/ changed but version $new is not above $old. Raise it (patch for wording, minor for new coverage) in plugin.json and SKILL.md metadata.version, and add a CHANGELOG.md entry."
            exit 1
          fi
          echo "version: ${old:-none} -> $new"

      - uses: actions/upload-artifact@v4
        with:
          name: skill-downloads
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: skill-downloads
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=7 HEAD)"
          version="$(cat dist/VERSION)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" ]; then
              echo "Release $tag already points at this commit, nothing to do."; exit 0
            fi
            # A push that only touches the build script, this workflow or plugin metadata ships
            # the same skill files, so the existing release stays as it is.
            if git diff --quiet "$tag" HEAD -- skills; then
              echo "skills/ unchanged since $tag, nothing new to release."; exit 0
            fi
            echo "::error file=.claude-plugin/plugin.json::skills/ changed since $tag but the version is still ${version}. Raise it in .claude-plugin/plugin.json and SKILL.md metadata.version."
            exit 1
          fi
          {
            echo "Skill \`sepay\` ${version} (commit ${sha}): $(git log -1 --format=%s)"
            echo
            echo "Changes: https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md"
            echo
            echo "- \`sepay.zip\`: upload to Claude (Customize → Skills), ChatGPT, Gemini or Grok, or unzip into \`~/.claude/skills/\` / \`~/.agents/skills/\`."
            echo "- \`sepay.md\`: the whole skill in one file, for chats without a Skills feature."
            echo "- Install guide: https://github.com/sepayvn/sepay-skills#cài-đặt"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$tag" dist/*.zip dist/*.md dist/SHA256SUMS \
            --title "sepay ${tag}" --notes-file notes.md --target "$GITHUB_SHA" --latest
